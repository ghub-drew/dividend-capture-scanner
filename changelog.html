<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 40px 20px 80px;
    line-height: 1.6;
  }

  .wrap { max-width: 760px; margin: 0 auto; }

  .topnav {
    display: flex;
    gap: 8px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }

  .topnav a {
    font-size: 0.82rem;
    font-weight: 600;
    color: #94a3b8;
    text-decoration: none;
    padding: 6px 14px;
    border: 1px solid #252d3d;
    border-radius: 20px;
    transition: all 0.15s;
  }
  .topnav a:hover { border-color: #4a90d9; color: #e2e8f0; }
  .topnav a.active { background: #1e3a5f33; border-color: #1d4ed855; color: #60a5fa; }

  header { margin-bottom: 40px; }

  .eyebrow {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #4a90d9;
    margin-bottom: 10px;
  }

  h1 {
    font-size: 2rem;
    font-weight: 700;
    color: #f8fafc;
    letter-spacing: -0.5px;
  }

  header p { margin-top: 10px; color: #64748b; font-size: 0.95rem; }

  /* Lock screen */
  .lock {
    background: #1a1f2e;
    border: 1px solid #252d3d;
    border-radius: 16px;
    padding: 44px 36px;
    text-align: center;
    max-width: 420px;
    margin: 30px auto 0;
  }

  .lock-icon {
    font-size: 2.4rem;
    margin-bottom: 14px;
  }

  .lock h2 { font-size: 1.15rem; color: #f1f5f9; margin-bottom: 6px; }
  .lock p { font-size: 0.86rem; color: #64748b; margin-bottom: 22px; }

  .lock-form { display: flex; flex-direction: column; gap: 12px; }

  .lock input {
    background: #0f1117;
    border: 1px solid #252d3d;
    border-radius: 8px;
    padding: 12px 16px;
    color: #e2e8f0;
    font-size: 0.95rem;
    text-align: center;
    letter-spacing: 0.1em;
    outline: none;
    transition: border-color 0.15s;
  }
  .lock input:focus { border-color: #4a90d9; }

  .lock button {
    background: #1d4ed8;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .lock button:hover { background: #1e40af; }

  .lock-error {
    font-size: 0.82rem;
    color: #fb7185;
    min-height: 18px;
  }

  /* Timeline (revealed after unlock) */
  #content { display: none; }

  .timeline { position: relative; padding-left: 28px; }
  .timeline::before {
    content: '';
    position: absolute;
    left: 7px; top: 6px; bottom: 6px;
    width: 2px; background: #252d3d;
  }
  .release { position: relative; margin-bottom: 28px; }
  .release::before {
    content: '';
    position: absolute;
    left: -28px; top: 24px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--dot, #4a90d9);
    border: 3px solid #0f1117;
  }
  .release-card {
    background: #1a1f2e;
    border: 1px solid #252d3d;
    border-radius: 14px;
    padding: 22px 26px;
  }
  .release-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
  .version { font-size: 1.1rem; font-weight: 700; color: #f1f5f9; }
  .badge {
    font-size: 0.66rem; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 2px 10px; border-radius: 20px;
  }
  .badge.current { background: #142208; color: #4ade80; border: 1px solid #15803d; }
  .badge.older   { background: #1e2433; color: #94a3b8; border: 1px solid #334155; }
  .release-date { font-size: 0.8rem; color: #64748b; margin-left: auto; }
  .release-title { font-size: 0.95rem; font-weight: 600; color: #cbd5e1; margin-bottom: 12px; }
  ul.changes { list-style: none; }
  ul.changes li {
    font-size: 0.88rem; color: #94a3b8;
    padding-left: 4px; margin-bottom: 8px; line-height: 1.5;
  }
  .lbl {
    display: inline-block; font-size: 0.66rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 1px 7px; border-radius: 4px; margin-right: 6px; vertical-align: middle;
  }
  .lbl.new  { background: #14392233; color: #4ade80; border: 1px solid #15803d55; }
  .lbl.imp  { background: #1e3a5f33; color: #60a5fa; border: 1px solid #1d4ed855; }
  .lbl.fix  { background: #3d250033; color: #fbbf24; border: 1px solid #b4530955; }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 0.78rem;
    color: #475569;
  }
  footer a { color: #4a90d9; text-decoration: none; }
</style>

  const ITERATIONS = 150000;

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function unlock(password) {
    const data = b64ToBytes(PAYLOAD);
    const salt = data.slice(0, 16);
    const iv = data.slice(16, 28);
    const ct = data.slice(28);

    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: ITERATIONS, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
    return new TextDecoder().decode(plainBuf);
  }

  document.getElementById("lockForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const pw = document.getElementById("pw").value;
    const err = document.getElementById("err");
    err.textContent = "";
    try {
      const html = await unlock(pw);
      document.getElementById("content").innerHTML = html;
      document.getElementById("content").style.display = "block";
      document.getElementById("lock").style.display = "none";
    } catch (_) {
      err.textContent = "Incorrect password. Please try again.";
      document.getElementById("pw").value = "";
      document.getElementById("pw").focus();
    }
  });
